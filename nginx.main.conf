# Replaces the stock /etc/nginx/nginx.conf entirely. We need our own copy
# because the stock one hardcodes `pid /var/run/nginx.pid;`, and the
# unprivileged "nginx" user (uid 101) we run as can't write there -- so we
# point pid, and the access/error logs, at locations that work non-root.
worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;

    # Same story as pid above: the unprivileged "nginx" user can't write to
    # the default /var/cache/nginx/* temp dirs in this image, but nginx
    # creates these under /tmp automatically on startup since /tmp is
    # always world-writable.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}

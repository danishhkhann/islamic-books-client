server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health {
        default_type text/plain;
        return 200 'ok';
    }

    # Vite fingerprints built asset filenames (e.g. index-a1b2c3.js), so a
    # new deploy always produces new filenames -- safe to cache these hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: react-router handles routes like /books/:category
    # client-side, so any path nginx doesn't recognize as a real file
    # should still return index.html. This replaces vercel.json's
    # "rewrites" rule.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
